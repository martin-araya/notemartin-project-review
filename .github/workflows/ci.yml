name: CI

on:
  push:
    branches: [main, "etapa-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install dev requirements
        run: pip install -r dev/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

      - name: Validate skill
        run: python dev/tools/validate_skill.py skills/notemartin-project-review

      - name: Overfit guard (stub en F00)
        continue-on-error: true
        run: python dev/tools/overfit_guard.py

      - name: Thresholds check (stub en F00)
        continue-on-error: true
        run: python dev/tools/check_thresholds.py