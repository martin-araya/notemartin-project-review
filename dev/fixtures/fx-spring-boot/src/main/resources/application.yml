# application.yml
# Perfiles dev (H2) y prod (Postgres). La property app.db.url
# controla el bean @ConditionalOnProperty de DatabaseConfig.
spring:
  application:
    name: fx-spring-boot
  datasource:
    url: jdbc:h2:mem:fxdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  db:
    url: h2   # activar el @ConditionalOnProperty con havingValue="postgres" en prod
  spring:
    profiles:
      active: dev

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/fxdb}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:fx}
    password: ${POSTGRES_PASSWORD:fx}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  db:
    url: postgres
