<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>fx-vanilla-js-legacy - Inicio</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="fx-top">
    <a href="/index.html">Inicio</a>
    <a href="/search.html">Buscar</a>
    <a href="/gallery.html">Galeria</a>
    <a href="/contact.html">Contacto</a>
    <!-- Boton con handler inline; el atributo data-action queda
         cubierto por el enganche delegado de app.js. -->
    <button onclick="window.App.run('loadGallery')">Cargar galeria</button>
  </header>

  <main>
    <h1>Bienvenido a la app legacy</h1>
    <p>Esta pagina demuestra dependencias por orden de &lt;script&gt;,
       handlers inline y dispatch por string.</p>

    <a href="#" id="fx-open-search-link" data-action="open-search">Abrir buscador</a>
  </main>

  <!-- Orden de <script>: define las dependencias. Si un bundler los
       reordena, $.fn.colorbox queda undefined y la feature de imagenes
       falla. -->
  <script src="/js/jquery-3.7.1.min.js"></script>
  <script src="/js/plugins/jquery.colorbox.js"></script>
  <script src="/js/plugins/jquery.debounce.js"></script>
  <script src="/js/dispatch.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/contact.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
