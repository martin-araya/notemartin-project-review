[workspace]
members = [".", "derive-macro"]
resolver = "2"

[package]
name = "fxrust-axum"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
fxrust-derive = { path = "derive-macro" }

[features]
default = []
legacy = []

[dev-dependencies]
tokio-test = "0.4"
