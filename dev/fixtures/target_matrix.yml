  # Trampas minimas por categoria (referenciadas en F06 y paquete por feature)
  traps:
    min_per_fixture:
      superficial: 3
      package: 6
    category_breadth:
      - dead-code
      - dynamic-import
      - string-dispatch
      - handler-registry
      - event-bus
      - readme-mismatch
      - feature-flag-disable
      - misleading-name
