# Matriz objetivo de cobertura de la skill (F06a2).
# Cada entrada debe estar cubierta por al menos un fixture antes de cerrar la
# etapa 0. `dev/tools/fixtures_matrix.py` compara la cobertura real contra esta
# lista y emite `dev/fixtures/MATRIX.md`.

