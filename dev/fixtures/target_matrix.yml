  Matriz objetivo de cobertura de la skill. Cada lenguaje, framework o sistema
  de build debe estar cubierto por al menos un fixture antes de cerrar la etapa
  0. El gate total se cierra al terminar F06f; durante F06a2..F06e la
  herramienta reporta progreso.

